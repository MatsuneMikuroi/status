<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Server status</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%226%22%20fill%3D%22%23687079%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #f5f7f9;
    --surface: #ffffff;
    --border: #e1e5ea;
    --text: #1a2129;
    --muted: #5d6874;
    --ok: #18794e;
    --down: #c4302b;
    --idle: #687079;
    --banner-ok: #1d7f4f;
    --banner-warn: #b45f06;
    --banner-down: #c4302b;
    --banner-idle: #5f6b76;
    --radius: 12px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --surface: #161c22;
      --border: #29313a;
      --text: #e6ebf0;
      --muted: #9aa5b1;
      --ok: #4cc38a;
      --down: #ff7b72;
      --idle: #9aa5b1;
      --banner-ok: #1f7a4c;
      --banner-warn: #a35a07;
      --banner-down: #b8322d;
      --banner-idle: #4b5560;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--font);
  }

  .page {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 46rem;
    margin: 0 auto;
    padding: 1.25rem 1rem 1.5rem;
  }

  /* Header */
  .top { display: flex; align-items: center; gap: .75rem; padding: .25rem 0 1.5rem; }
  .brand { display: flex; align-items: center; gap: .65rem; margin: 0; font-size: 1.1rem; font-weight: 650; letter-spacing: -.01em; }
  .brand-mark {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 8px;
    background: var(--text);
    color: var(--bg);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .badge {
    padding: .1rem .55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: .75rem;
    font-weight: 600;
  }

  main { display: grid; flex: 1; align-content: start; gap: 1rem; }

  /* Overall status */
  .banner {
    --tone-bg: var(--banner-idle);
    display: flex;
    align-items: flex-start;
    gap: .9rem;
    padding: 1.15rem 1.25rem;
    border-radius: var(--radius);
    background: var(--tone-bg);
    color: #fff;
    transition: background-color .3s ease;
  }
  .banner[data-tone="ok"] { --tone-bg: var(--banner-ok); }
  .banner[data-tone="warn"] { --tone-bg: var(--banner-warn); }
  .banner[data-tone="down"] { --tone-bg: var(--banner-down); }
  .banner-icon { flex: none; padding-top: .05rem; }
  .banner-icon svg { display: block; width: 28px; height: 28px; }
  .banner-title { margin: 0; font-size: 1.25rem; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }
  .banner-text { margin: .2rem 0 0; opacity: .92; text-wrap: pretty; }

  /* Cards */
  .card { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .card-head { padding: .8rem 1.25rem; border-bottom: 1px solid var(--border); }
  .card-head h2 { margin: 0; font-size: .95rem; font-weight: 650; }

  .update-list { margin: 0; padding: 0; list-style: none; }
  .update { padding: .9rem 1.25rem 1rem; }
  .update + .update { border-top: 1px solid var(--border); }
  .update-when { margin: 0 0 .2rem; color: var(--muted); font-size: .85rem; }
  .update-when time { color: var(--text); font-weight: 600; }
  .update-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .service-list { margin: 0; padding: 0; list-style: none; }
  .service {
    --tone: var(--idle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .85rem 1.25rem;
  }
  .service + .service { border-top: 1px solid var(--border); }
  .service[data-status="operational"] { --tone: var(--ok); }
  .service[data-status="outage"] { --tone: var(--down); }
  .service-info { display: grid; min-width: 0; }
  .service-name { font-weight: 600; }
  .service-desc { color: var(--muted); font-size: .85rem; }
  .service-status {
    display: inline-flex;
    flex: none;
    align-items: center;
    gap: .4rem;
    color: var(--tone);
    font-size: .9rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .service-status svg { display: block; width: 18px; height: 18px; }

  .meta { margin: .25rem 0 0; color: var(--muted); font-size: .875rem; }

  .foot { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }
  .foot p { margin: 0; }

  .spin { transform-origin: 50% 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }

  @media (min-width: 40rem) {
    .page { padding-top: 2.5rem; }
    .banner { padding: 1.4rem 1.5rem; }
    .banner-title { font-size: 1.4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .banner { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
      </span>
      <span id="siteName">Server status</span>
    </h1>
    <span class="badge" id="demoBadge" hidden>Preview</span>
  </header>

  <main>
    <section class="banner" id="banner" data-tone="idle" role="status" aria-atomic="true">
      <span class="banner-icon" id="bannerIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>
      </span>
      <div>
        <p class="banner-title" id="bannerTitle">Checking status…</p>
        <p class="banner-text" id="bannerText">This takes a few seconds.</p>
        <noscript><p class="banner-text">This page needs JavaScript to check the services.</p></noscript>
      </div>
    </section>

    <section class="card" id="updates" aria-labelledby="updatesTitle" hidden>
      <div class="card-head">
        <h2 id="updatesTitle">Updates</h2>
      </div>
      <ol class="update-list" id="updateList"></ol>
    </section>

    <section class="card" aria-labelledby="servicesTitle">
      <div class="card-head">
        <h2 id="servicesTitle">Services</h2>
      </div>
      <ul class="service-list" id="serviceList"></ul>
    </section>

    <p class="meta" id="checkInfo">Checking now…</p>
  </main>

  <footer class="foot">
    <p>This page is hosted independently of the services it monitors, so it stays available during outages.</p>
  </footer>
</div>

<script>
(() => {
  "use strict";

  // ===========================================================================
  // Settings
  // ===========================================================================

  // Shown at the top of the page and in the browser tab.
  const SITE_NAME = "Server status";

  // The services listed on the page, in this order. Each one is checked from
  // the visitor's browser, in one of two ways:
  //   "image"      Operational when this picture loads. Point it at a small icon
  //                the app itself serves: when the app is down, the proxy answers
  //                with an error page instead, and the picture fails to load.
  //   "reachable"  Operational as soon as anything answers at this address.
  //                Meant for pages the proxy serves itself.
  // Only list addresses this server answers itself. If one moves elsewhere,
  // remove it, or it will keep showing as Operational while the server is off.
  const SERVICES = [
    { name: "Website", description: "Main website", check: "reachable", url: "https://de-groote.ch/" },
    { name: "Git", description: "Code hosting", check: "image", url: "https://git.de-groote.ch/assets/img/favicon.png" },
  ];

  // Updates posted with the status-post script (or by hand on GitHub), one per
  // line in this file, next to the page. See README.md for the format.
  const UPDATES_FILE = "updates.txt";
  const UPDATE_MAX_AGE_DAYS = 7;        // hide older updates (0 = never hide)

  const TIMEOUT_MS = 8000;              // how long to wait for each answer
  const RECHECK_OK_MS = 2 * 60 * 1000;  // check every 2 minutes while all is well
  const RECHECK_ISSUE_MS = 30 * 1000;   // and every 30 seconds otherwise
  const LOCALE = "en-GB";               // how dates and times are written

  // ===========================================================================
  // Wording
  // ===========================================================================

  const OVERALL = {
    checking: { title: "Checking status…", text: "This takes a few seconds." },
    operational: { title: "All systems operational", text: "Everything is up and running." },
    back: { title: "All systems operational", text: "All services are back up and running." },
    partial: { title: "Partial outage", text: "Some services aren’t responding. The others are working normally." },
    major: { title: "Major outage", text: "None of the services are responding at the moment. They will be back as soon as possible." },
    unreachable: { title: "Major outage", text: "The server is currently unreachable. Services will be back as soon as possible." },
    unknown: { title: "Unable to check status", text: "Your device appears to be offline. The page will check again automatically." },
  };
  const STATUS_LABEL = { checking: "Checking", operational: "Operational", outage: "Outage", unknown: "Unknown" };

  // ===========================================================================
  // Look
  // ===========================================================================

  const TONE = { checking: "idle", operational: "ok", back: "ok", partial: "warn", major: "down", unreachable: "down", unknown: "idle" };
  const FAVICON = { idle: "#687079", ok: "#1d7f4f", warn: "#b45f06", down: "#c4302b" };
  const svg = (body) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
  const ICONS = {
    spinner: svg('<g class="spin"><circle cx="12" cy="12" r="9" opacity=".3"/><path d="M21 12a9 9 0 0 0-9-9"/></g>'),
    check: svg('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7 5.3-5.6"/>'),
    cross: svg('<circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>'),
    alert: svg('<path d="M12 3.8 21.2 19.6H2.8z"/><path d="M12 10v4"/><path d="M12 16.9v.1"/>'),
    minus: svg('<circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/>'),
  };
  const BANNER_ICON = { checking: "spinner", operational: "check", back: "check", partial: "alert", major: "cross", unreachable: "cross", unknown: "minus" };
  const STATUS_ICON = { checking: "spinner", operational: "check", outage: "cross", unknown: "minus" };

  // ?demo=operational, partial, major or offline shows that view with made-up
  // results, without contacting the server.
  const DEMOS = ["operational", "partial", "major", "offline"];
  const params = new URLSearchParams(window.location.search);
  const demo = DEMOS.includes(params.get("demo")) ? params.get("demo") : null;

  const NBSP = " ";
  const els = {};
  for (const id of ["favicon", "siteName", "demoBadge", "banner", "bannerIcon", "bannerTitle", "bannerText",
                    "updates", "updateList", "serviceList", "checkInfo"]) {
    els[id] = document.getElementById(id);
  }

  let overall = "checking";            // checking | operational | partial | major | unreachable | unknown
  let statuses = SERVICES.map(() => "checking");
  let sawIssue = false;                // something was wrong at some point while the page was open
  let shownBanner = null;
  let updates = [];                    // [{ time, text }], newest first
  let lastChecked = null;
  let nextCheckAt = 0;
  let checking = false;

  const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function setText(el, text) {
    if (el.textContent !== text) el.textContent = text;
  }

  // ===========================================================================
  // Checks
  // ===========================================================================

  // fetch() that gives up after TIMEOUT_MS instead of waiting forever.
  // With readText, the body has to arrive within that time too.
  async function fetchWithTimeout(url, options, readText) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      const text = readText && res.ok ? await res.text() : null;
      return { res, text };
    } finally {
      clearTimeout(timer);
    }
  }

  // Did anything answer at this address? "no-cors" means the reply can't be
  // read, which is fine: the request only fails outright when nothing answers
  // (connection refused, timeout, DNS).
  async function answers(url) {
    try {
      await fetchWithTimeout(url, { mode: "no-cors", cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" }, false);
      return true;
    } catch (e) {
      return false;
    }
  }

  function imageLoads(url) {
    return new Promise((resolve) => {
      const img = new Image();
      const finish = (ok) => {
        clearTimeout(timer);
        img.onload = img.onerror = null;
        resolve(ok);
      };
      const timer = setTimeout(() => {
        finish(false);
        img.src = "";  // cancel the request, so it doesn't hang on in the background
      }, TIMEOUT_MS);
      img.onload = () => finish(img.naturalWidth > 0);
      img.onerror = () => finish(false);
      img.referrerPolicy = "no-referrer";
      img.src = url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
    });
  }

  async function checkService(service) {
    const reachable = answers(service.url);  // runs alongside the main check
    let status;
    if (service.check === "image") status = (await imageLoads(service.url)) ? "operational" : "outage";
    else status = (await reachable) ? "operational" : "outage";
    return { status, reachable: await reachable };
  }

  function demoResults() {
    const picked = SERVICES.length - 1;
    return delay(600).then(() => SERVICES.map((service, i) => {
      if (demo === "operational") return { status: "operational", reachable: true };
      if (demo === "partial") return { status: i === picked ? "outage" : "operational", reachable: true };
      return { status: "outage", reachable: false };  // major, offline
    }));
  }

  // One word for the whole page, from the individual results.
  function summarize(results, hostAnswered) {
    const outages = results.filter((r) => r.status === "outage").length;
    if (outages === 0) return "operational";
    if (outages < results.length) return "partial";
    if (results.some((r) => r.reachable)) return "major";  // the server answers, the services don't
    return hostAnswered ? "unreachable" : "unknown";      // nothing answers: the server, or the visitor's own connection
  }

  // ===========================================================================
  // Updates (updates.txt, next to this page)
  // ===========================================================================

  // One update per line: the time it was posted, a space, then the message.
  //   2026-10-20T07:42:13+02:00 Message   what the status-post script writes
  //   2026-10-20 07:42 Message            easier by hand; read as the visitor's local time
  // Lines without a time get the time the file was last published.
  const LINE = /^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?(Z|[+-]\d{2}:?\d{2})?\s+(.+)$/;

  function parseUpdates(text, fileTime) {
    const list = [];
    text.split(/\r?\n/).forEach((raw, index) => {
      const line = raw.trim();
      if (!line || line.startsWith("#")) return;
      let time = null;
      let message = line;
      const m = LINE.exec(line);
      if (m) {
        const [, y, mo, d, h, mi, s = "00", zone, rest] = m;
        time = zone
          ? new Date(`${y}-${mo}-${d}T${h.padStart(2, "0")}:${mi}:${s}${zone === "Z" ? "Z" : zone.replace(/^([+-]\d{2}):?(\d{2})$/, "$1:$2")}`)
          : new Date(+y, +mo - 1, +d, +h, +mi, +s);
        if (Number.isNaN(time.getTime())) time = null;
        else message = rest.trim();
      }
      list.push({ time: time || fileTime, text: message, index });
    });
    const cutoff = UPDATE_MAX_AGE_DAYS > 0 ? Date.now() - UPDATE_MAX_AGE_DAYS * 86400000 : -Infinity;
    const at = (u) => (u.time ? u.time.getTime() : Infinity);
    return list
      .filter((u) => !u.time || u.time.getTime() >= cutoff)
      .sort((a, b) => (at(b) - at(a)) || (b.index - a.index));
  }

  // Returns whether this page's own host answered. If it didn't either, the
  // problem is most likely the visitor's connection, not the server.
  async function loadUpdates() {
    let reply;
    try {
      reply = await fetchWithTimeout(UPDATES_FILE, { cache: "no-store" }, true);
    } catch (e) {
      return false;  // keep whatever updates we already had
    }
    const { res, text } = reply;
    if (!res.ok) {
      if (res.status === 404) updates = [];  // no updates file at all: nothing to show
      return true;
    }
    const header = res.headers.get("last-modified");
    const fileTime = header ? new Date(header) : null;
    updates = parseUpdates(text, fileTime && !Number.isNaN(fileTime.getTime()) ? fileTime : null);
    return true;
  }

  const STAMP = new Intl.DateTimeFormat(LOCALE, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });

  function relativeTime(date) {
    try {
      const minutes = Math.round((date.getTime() - Date.now()) / 60000);
      if (minutes > -1) return "just now";
      const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: "auto" });
      if (minutes > -60) return rtf.format(minutes, "minute");
      if (minutes > -48 * 60) return rtf.format(Math.round(minutes / 60), "hour");
      return rtf.format(Math.round(minutes / 1440), "day");
    } catch (e) {
      return null;
    }
  }

  // ===========================================================================
  // Page
  // ===========================================================================

  const rows = SERVICES.map((service) => {
    const li = document.createElement("li");
    li.className = "service";
    const info = document.createElement("div");
    info.className = "service-info";
    const name = document.createElement("span");
    name.className = "service-name";
    name.textContent = service.name;
    info.append(name);
    if (service.description) {
      const desc = document.createElement("span");
      desc.className = "service-desc";
      desc.textContent = service.description;
      info.append(desc);
    }
    const status = document.createElement("span");
    status.className = "service-status";
    const icon = document.createElement("span");
    const label = document.createElement("span");
    status.append(icon, label);
    li.append(info, status);
    els.serviceList.append(li);
    return { li, icon, label, shown: null };
  });

  function renderUpdates() {
    els.updates.hidden = updates.length === 0;
    els.updateList.replaceChildren(...updates.map((update) => {
      const li = document.createElement("li");
      li.className = "update";
      if (update.time) {
        const when = document.createElement("p");
        when.className = "update-when";
        const time = document.createElement("time");
        time.dateTime = update.time.toISOString();
        time.textContent = STAMP.format(update.time);
        when.append(time);
        const ago = relativeTime(update.time);
        if (ago) when.append(` · ${ago}`);
        li.append(when);
      }
      const text = document.createElement("p");
      text.className = "update-text";
      text.textContent = update.text;
      li.append(text);
      return li;
    }));
  }

  function renderMeta() {
    if (checking || !lastChecked) {
      setText(els.checkInfo, "Checking now…");
      return;
    }
    const secs = Math.max(0, Math.ceil((nextCheckAt - Date.now()) / 1000));
    const time = new Intl.DateTimeFormat(LOCALE, { hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(lastChecked);
    setText(els.checkInfo, `Last checked at ${time} · next check in ${secs}${NBSP}s`);
  }

  function render() {
    const key = overall === "operational" && sawIssue ? "back" : overall;
    const copy = OVERALL[key];
    const tone = TONE[key];

    setText(els.siteName, SITE_NAME);
    els.demoBadge.hidden = !demo;
    document.title = key === "checking" ? SITE_NAME : `${copy.title} · ${SITE_NAME}`;

    els.banner.dataset.tone = tone;
    if (shownBanner !== key) {
      els.bannerIcon.innerHTML = ICONS[BANNER_ICON[key]];
      setText(els.bannerTitle, copy.title);
      setText(els.bannerText, copy.text);
      shownBanner = key;
    }

    statuses.forEach((status, i) => {
      const row = rows[i];
      if (row.shown === status) return;
      row.li.dataset.status = status;
      row.icon.innerHTML = ICONS[STATUS_ICON[status]];
      row.label.textContent = STATUS_LABEL[status];
      row.shown = status;
    });

    renderUpdates();

    const dot = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="${FAVICON[tone]}"/></svg>`;
    els.favicon.setAttribute("href", "data:image/svg+xml," + encodeURIComponent(dot));

    renderMeta();
  }

  async function check() {
    if (checking) return;
    checking = true;
    renderMeta();
    try {
      // The updates usually arrive first, so show them straight away.
      const updatesLoaded = loadUpdates().then((reachedHost) => {
        renderUpdates();
        return reachedHost;
      });
      const [results, reachedHost] = await Promise.all([
        demo ? demoResults() : Promise.all(SERVICES.map(checkService)),
        updatesLoaded,
      ]);
      const hostAnswered = demo ? demo !== "offline" : reachedHost;
      overall = summarize(results, hostAnswered);
      statuses = results.map((r) => (overall === "unknown" ? "unknown" : r.status));
      if (overall !== "operational" && overall !== "unknown") sawIssue = true;
    } finally {
      lastChecked = new Date();
      nextCheckAt = Date.now() + (overall === "operational" ? RECHECK_OK_MS : RECHECK_ISSUE_MS);
      checking = false;
      render();
    }
  }

  function checkIfDue() {
    if (!checking && lastChecked && !document.hidden && Date.now() >= nextCheckAt) {
      check();
    } else {
      renderMeta();
    }
  }

  document.addEventListener("visibilitychange", checkIfDue);
  window.addEventListener("online", () => check());
  window.setInterval(checkIfDue, 1000);

  render();
  // Start once the page itself has loaded, so slow checks don't keep the
  // browser's loading indicator spinning.
  if (document.readyState === "complete") check();
  else window.addEventListener("load", () => check(), { once: true });
})();
</script>
</body>
</html>
